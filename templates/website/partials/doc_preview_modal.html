{% load i18n %}
<style>
    #docPreviewModal .modal-body { padding: .5rem; background: #f1f3f5; }
    #docPreviewModal .doc-preview-frame {
        width: 100%; height: min(78vh, 820px); border: 0; background: #fff; border-radius: 4px;
    }
    #docPreviewModal .doc-preview-img {
        display: block; max-width: 100%; max-height: min(78vh, 820px);
        margin: 0 auto; border-radius: 4px;
    }
    #docPreviewModal .doc-preview-fallback { display: none; text-align: center; padding: 2rem 1rem; }
</style>
<div class="modal fade" id="docPreviewModal" tabindex="-1" aria-hidden="true"
     data-default-title="{% trans 'Документ' %}">
  <div class="modal-dialog modal-xl modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header py-2">
        <h6 class="modal-title" id="docPreviewTitle">{% trans "Документ" %}</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <iframe class="doc-preview-frame" title="{% trans 'Просмотр документа' %}"></iframe>
        <img class="doc-preview-img d-none" alt="">
        <div class="doc-preview-fallback">
          <p class="text-muted mb-2">{% trans "Предпросмотр недоступен для этого файла." %}</p>
          <a class="btn btn-sm btn-primary doc-preview-download" href="#" download>
            <i class="bi bi-download"></i> {% trans "Скачать" %}
          </a>
        </div>
      </div>
      <div class="modal-footer py-2">
        <a class="btn btn-sm btn-outline-primary doc-preview-download" href="#" download>
          <i class="bi bi-download"></i> {% trans "Скачать" %}
        </a>
        <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">{% trans "Закрыть" %}</button>
      </div>
    </div>
  </div>
</div>
<script>
(function () {
    function isImageName(name) {
        return /\.(jpe?g|png|gif|webp)$/i.test(name || "");
    }

    var previewObjectUrl = null;
    var modalEl = document.getElementById("docPreviewModal");
    if (!modalEl) return;

    function revokePreviewObjectUrl() {
        if (previewObjectUrl) {
            URL.revokeObjectURL(previewObjectUrl);
            previewObjectUrl = null;
        }
    }

    function showPreviewParts(mode) {
        var frame = modalEl.querySelector(".doc-preview-frame");
        var img = modalEl.querySelector(".doc-preview-img");
        var fallback = modalEl.querySelector(".doc-preview-fallback");
        frame.classList.toggle("d-none", mode !== "pdf");
        img.classList.toggle("d-none", mode !== "image");
        fallback.style.display = mode === "fallback" ? "block" : "none";
        if (mode !== "pdf") frame.removeAttribute("src");
        if (mode !== "image") img.removeAttribute("src");
    }

    function openDocPreview(url, title, filename) {
        if (!url) return;
        var frame = modalEl.querySelector(".doc-preview-frame");
        var img = modalEl.querySelector(".doc-preview-img");
        var titleEl = modalEl.querySelector("#docPreviewTitle");
        var downloads = modalEl.querySelectorAll(".doc-preview-download");
        var name = filename || url.split("/").pop() || "";
        var defaultTitle = modalEl.getAttribute("data-default-title") || "";
        if (titleEl) titleEl.textContent = title || name || defaultTitle;
        downloads.forEach(function (a) {
            a.href = url;
            a.setAttribute("download", name);
        });
        revokePreviewObjectUrl();
        bootstrap.Modal.getOrCreateInstance(modalEl).show();

        if (isImageName(name) || isImageName(url)) {
            showPreviewParts("image");
            img.src = url;
            img.alt = name;
            return;
        }

        if (!(/\.pdf($|\?)/i.test(name) || /\.pdf($|\?)/i.test(url))) {
            showPreviewParts("fallback");
            return;
        }

        showPreviewParts("pdf");
        frame.removeAttribute("src");
        fetch(url, { credentials: "same-origin" })
            .then(function (resp) {
                if (!resp.ok) throw new Error("HTTP " + resp.status);
                return resp.blob();
            })
            .then(function (blob) {
                var pdfBlob = blob.type === "application/pdf"
                    ? blob
                    : new Blob([blob], { type: "application/pdf" });
                previewObjectUrl = URL.createObjectURL(pdfBlob);
                frame.src = previewObjectUrl;
            })
            .catch(function () {
                showPreviewParts("fallback");
            });
    }

    modalEl.addEventListener("hidden.bs.modal", function () {
        var frame = modalEl.querySelector(".doc-preview-frame");
        var img = modalEl.querySelector(".doc-preview-img");
        revokePreviewObjectUrl();
        if (frame) frame.removeAttribute("src");
        if (img) img.removeAttribute("src");
    });

    document.addEventListener("click", function (e) {
        var previewBtn = e.target.closest(".doc-preview-btn");
        if (!previewBtn) return;
        e.preventDefault();
        e.stopPropagation();
        openDocPreview(previewBtn.dataset.url, previewBtn.dataset.title, previewBtn.dataset.filename);
    });
})();
</script>
